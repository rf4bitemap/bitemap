name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: choco install tesseract -y --no-progress
      - run: python tools/build_client.py
      - run: pytest -q client/tests
      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process dist/BiteMapLogger/BiteMapLogger.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:APPDATA/BiteMap/selftest.txt"; exit 1 }
      - name: Sign for the in-app updater (latest.json)
        shell: pwsh
        env:
          BITEMAP_SIGNING_KEY: ${{ secrets.BITEMAP_SIGNING_KEY }}
        run: python tools/sign_release.py (Get-Item dist/*.zip).FullName
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/latest.json
          generate_release_notes: true
