# Production stack for a single VPS: PostgreSQL + BiteMap API/website + Caddy (automatic HTTPS).
#   cp .env.example .env   # set DOMAIN, ACME_EMAIL and POSTGRES_PASSWORD
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bitemap
      POSTGRES_USER: bitemap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitemap"]
      interval: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://bitemap:${POSTGRES_PASSWORD}@db:5432/bitemap
      TRUST_PROXY: "1"
      BITEMAP_MIN_CLIENT: ${BITEMAP_MIN_CLIENT:-}
    volumes:
      - ./data/maps:/app/data/maps:ro      # add/replace map images without rebuilding
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
